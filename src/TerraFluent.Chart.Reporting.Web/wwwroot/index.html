<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADP Analytics &amp; Reporting Studio</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <div class="app">
    <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">ADP</span>
        <div class="brand-text">
          <strong>Analytics Studio</strong>
          <span>Reporting &amp; Insights</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="data">
          <span class="nav-ico" data-icon="database"></span><span>Data Source</span>
        </button>
        <button class="nav-item" data-view="dashboard">
          <span class="nav-ico" data-icon="grid"></span><span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="analyze">
          <span class="nav-ico" data-icon="bar-chart"></span><span>Analyze</span>
        </button>
        <button class="nav-item" data-view="agent">
          <span class="nav-ico" data-icon="message"></span><span>Ask the Agent</span>
        </button>
        <button class="nav-item" data-view="aggregate">
          <span class="nav-ico" data-icon="sigma"></span><span>Aggregate</span>
        </button>
        <button class="nav-item" data-view="quality">
          <span class="nav-ico" data-icon="check-circle"></span><span>Data Quality</span>
        </button>
        <button class="nav-item" data-view="studio">
          <span class="nav-ico" data-icon="trending-up"></span><span>Chart Studio</span>
        </button>
        <button class="nav-item" data-view="catalogue">
          <span class="nav-ico" data-icon="list"></span><span>Catalogue</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-ico" data-icon="settings"></span><span>Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="ds-badge" id="dsBadge">
          <span class="ds-dot"></span>
          <div>
            <strong id="dsName">No dataset</strong>
            <span id="dsMeta">Add data to begin</span>
          </div>
        </div>
        <div class="privacy-chip" title="Data is processed in memory only — never written to a database, disk, or browser storage.">
          <span aria-hidden="true" data-icon="lock" data-icon-size="13"></span> In-memory only · never stored
        </div>
      </div>
    </aside>

    <!-- ── Main ────────────────────────────────────────────────────────── -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="menuToggle" title="Toggle menu" data-icon="menu"></button>
          <h1 id="viewTitle">Data Source</h1>
        </div>
        <div class="topbar-right">
          <span class="api-status" id="apiStatus" title="Analytics Agent status">
            <span class="api-dot"></span><span id="apiStatusText">Agent</span>
          </span>
          <button class="icon-btn" id="settingsBtn" data-goto="settings" title="Settings" aria-label="Settings" data-icon="settings"></button>
        </div>
      </header>

      <main class="content" id="content"><!-- views injected here --></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
