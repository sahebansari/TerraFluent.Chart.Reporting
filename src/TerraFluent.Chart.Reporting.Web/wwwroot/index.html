<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADP Analytics &amp; Reporting Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <div class="app">
    <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">ADP</span>
        <div class="brand-text">
          <strong>Analytics Studio</strong>
          <span>Reporting &amp; Insights</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="data">
          <span class="nav-ico">▦</span><span>Data Source</span>
        </button>
        <button class="nav-item" data-view="dashboard">
          <span class="nav-ico">◫</span><span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="analyze">
          <span class="nav-ico">✦</span><span>Analyze</span>
        </button>
        <button class="nav-item" data-view="agent">
          <span class="nav-ico">✎</span><span>Ask the Agent</span>
        </button>
        <button class="nav-item" data-view="aggregate">
          <span class="nav-ico">∑</span><span>Aggregate</span>
        </button>
        <button class="nav-item" data-view="quality">
          <span class="nav-ico">✓</span><span>Data Quality</span>
        </button>
        <button class="nav-item" data-view="studio">
          <span class="nav-ico">▤</span><span>Chart Studio</span>
        </button>
        <button class="nav-item" data-view="catalogue">
          <span class="nav-ico">☰</span><span>Catalogue</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="ds-badge" id="dsBadge">
          <span class="ds-dot"></span>
          <div>
            <strong id="dsName">No dataset</strong>
            <span id="dsMeta">Add data to begin</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- ── Main ────────────────────────────────────────────────────────── -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="menuToggle" title="Toggle menu">☰</button>
          <h1 id="viewTitle">Data Source</h1>
        </div>
        <div class="topbar-right">
          <span class="api-status" id="apiStatus" title="API connectivity">
            <span class="api-dot"></span><span id="apiStatusText">Checking API…</span>
          </span>
          <button class="btn ghost" id="loadSampleTop">Load sample</button>
        </div>
      </header>

      <main class="content" id="content"><!-- views injected here --></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
