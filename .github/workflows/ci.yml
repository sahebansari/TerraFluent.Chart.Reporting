name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for SourceLink

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.x
            8.x
            10.x

      - name: Restore
        run: dotnet restore TerraFluent.Chart.Reporting.sln

      - name: Build (Release)
        run: dotnet build TerraFluent.Chart.Reporting.sln --configuration Release --no-restore

      # Runs every test project in the solution — the chart library, the analytics engine, the
      # connectors and the API integration tests — rather than the chart library alone.
      - name: Test (.NET)
        run: >
          dotnet test TerraFluent.Chart.Reporting.sln
          --configuration Release
          --no-build
          --logger "console;verbosity=minimal"
          --collect:"XPlat Code Coverage"
          --results-directory coverage

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Studio SPA is dependency-free, so its tests run on Node's built-in runner with no install.
      - name: Test (Studio SPA)
        working-directory: tests/TerraFluent.Studio.Web.Tests
        run: node --test

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          directory: coverage
          flags: unittests
          fail_ci_if_error: false
